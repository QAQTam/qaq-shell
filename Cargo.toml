[package]
name = "qaq-shell"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qaq-shell"
path = "src/main.rs"

[[bin]]
name = "perfmon"
path = "src/bin/perfmon.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
